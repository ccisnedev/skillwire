# macss and inquiry upload `code/site` as it stands, because their sites are
# hand-written HTML. This one is Jaspr source and has to be built.
name: Deploy Pages

on:
  push:
    branches:
      - main
    paths:
      - 'code/site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # One checkout. The design system arrives as a pinned git dependency, so
      # there is no sibling repository to arrange and no contrived directory
      # layout to keep in step with a relative path.
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      # Pinned. A floating build tool means the published page can change
      # without a commit that explains why.
      - run: dart pub global activate jaspr_cli 0.23.4

      - name: Build the site
        working-directory: code/site
        run: |
          dart pub get
          dart pub global run jaspr_cli:jaspr build

      # Three things `jaspr build` leaves behind that a published site should
      # not carry:
      #
      #   packages/         emitted by build_web_compilers for a client
      #                     entrypoint this site does not have. Nothing in
      #                     index.html references it, and it is the difference
      #                     between publishing 25 KB and publishing 700.
      #   .dart_tool/       package_config.json, which records absolute paths on
      #                     the build machine.
      #   .build.manifest   an index of the above.
      #
      # deploy-pages runs no Jekyll, so dotfiles are published as they are; they
      # do not disappear on their own.
      - name: Drop what the artifact should not carry
        working-directory: code/site/build/jaspr
        run: rm -rf packages .dart_tool .build.manifest

      - uses: actions/configure-pages@v5

      # `web/CNAME` is copied to the build root by `jaspr build`. The custom
      # domain is also declared in the repository's Pages settings, which is
      # what actually attaches it — in Actions mode the file alone does not.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: code/site/build/jaspr

      - id: deployment
        uses: actions/deploy-pages@v4
