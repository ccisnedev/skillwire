# macss and inquiry each ship one package, so their CI is one job. This
# repository ships three, and a green mark that did not say *which* of them is
# green would be worth less than no mark. The matrix names the package, so a
# failure reads as "datajack on Windows" rather than "CI".
#
# The paths filter is `code/**` and not per-package. A site-only change still
# runs the package matrix, which costs a few minutes and buys the thing that
# matters: on this repository, green means everything is green. A workflow whose
# jobs skip selectively makes a green check ambiguous, and an ambiguous check is
# one nobody reads.
name: CI

on:
  push:
    branches: [main]
    paths:
      - 'code/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'code/**'
      - '.github/workflows/ci.yml'

jobs:
  # ─── The three packages ────────────────────────────────────────────────────
  test:
    name: ${{ matrix.package }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # `cli` is the directory; the package inside it is `skillwire_cli`.
        package: [skillwire, datajack, cli]
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: dart pub get
        working-directory: code/${{ matrix.package }}
        run: dart pub get

      - name: dart analyze
        working-directory: code/${{ matrix.package }}
        run: dart analyze --fatal-infos

      - name: dart test
        working-directory: code/${{ matrix.package }}
        run: dart test

  # ─── The site ──────────────────────────────────────────────────────────────
  site:
    # The site is source, and `pages.yml` publishes it on merge. Without this
    # job the first sign that it stopped compiling would be a failed deploy —
    # after the decision to publish, rather than before it.
    name: site
    runs-on: ubuntu-latest

    steps:
      # One checkout: the design system is a pinned git dependency, not a
      # sibling this workflow has to arrange.
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      # Pinned to the version `pages.yml` publishes with. A CI that builds with
      # a different tool than the deploy is checking something else.
      - run: dart pub global activate jaspr_cli 0.23.4

      - name: dart pub get
        working-directory: code/site
        run: dart pub get

      # `--fatal-infos` matters more here than elsewhere: jaspr_lints reports
      # its rules as infos, and `styles_ordering` is one of them.
      - name: dart analyze
        working-directory: code/site
        run: dart analyze --fatal-infos

      # Analysis does not run the builders, and `@css` generation is where a
      # site breaks without any Dart being wrong.
      - name: jaspr build
        working-directory: code/site
        run: dart pub global run jaspr_cli:jaspr build

      # The deploy publishes exactly these files. If the set ever changes
      # silently — a stray dotfile, a missing CNAME — this is where it shows.
      - name: The artifact is what it should be
        working-directory: code/site/build/jaspr
        run: |
          rm -rf packages .dart_tool .build.manifest
          found=$(echo $(ls -A | sort))
          echo "Built: $found"
          [ "$found" = "CNAME favicon.ico index.html install.ps1 install.sh" ] || {
            echo "::error::Unexpected set of published files: $found"
            exit 1
          }
          grep -qx 'skillwire.ccisne.dev' CNAME || {
            echo "::error::CNAME does not name the site's domain"
            exit 1
          }
