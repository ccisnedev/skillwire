name: skillwire_cli
description: >-
  Canonical command-line consumer of the skillwire package. Deploys skills to
  Claude Code, Codex, Antigravity, OpenCode and GitHub Copilot.
version: 0.0.1
publish_to: none
repository: https://github.com/ccisnedev/skillwire

environment:
  sdk: ^3.6.0

executables:
  skillwire: main
  sw: main

dependencies:
  skillwire:
    path: ../skillwire

# Implementation starts at P4. See docs/PRD.md.
