name: skillwire_cli
description: >-
  Canonical command-line consumer of the skillwire package. Deploys skills to
  Claude Code, Codex, Antigravity, OpenCode and GitHub Copilot.
version: 0.1.0
publish_to: none
repository: https://github.com/ccisnedev/skillwire

environment:
  sdk: ^3.8.1

executables:
  skillwire: main
  sw: main

dependencies:
  cli_router: ^0.1.0
  datajack: ^0.1.0
  modular_cli_sdk: ^0.5.0
  path: ^1.9.1
  skillwire: ^0.2.0

# Both are published, and both are also developed in this repository. The
# overrides keep this CLI building against the working tree rather than
# against the last release, so a change to either package is exercised by
# `skillwire_cli`'s tests before it is published rather than after.
dependency_overrides:
  datajack:
    path: ../datajack
  skillwire:
    path: ../skillwire

dev_dependencies:
  lints: ^6.1.0
  test: ^1.31.0
