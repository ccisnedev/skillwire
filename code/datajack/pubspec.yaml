name: datajack
description: >-
  The command-line surface of the skillwire package: a `skill` module of five
  routes that any modular_cli_sdk CLI mounts to deploy agent skills into AI
  coding hosts. The port a person plugs into; skillwire is the wire.
version: 0.1.0
repository: https://github.com/ccisnedev/skillwire
issue_tracker: https://github.com/ccisnedev/skillwire/issues

environment:
  sdk: ^3.8.1

dependencies:
  cli_router: ^0.1.0
  modular_cli_sdk: ^0.5.0
  path: ^1.9.1
  skillwire: ^0.2.0

# While skillwire 0.2.0 is unpublished. Removed once it is on pub.dev; the
# constraint above is what ships.
dependency_overrides:
  skillwire:
    path: ../skillwire

dev_dependencies:
  lints: ^6.1.0
  test: ^1.31.0

topics:
  - cli
  - agent-skills
  - macss
