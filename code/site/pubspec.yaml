name: skillwire_site
description: The site at skillwire.ccisne.dev. Source, not output.
publish_to: none

environment:
  sdk: ^3.10.0

dependencies:
  jaspr: ^0.23.4

  # The design-system laboratory. A path dependency because the package is not
  # published and will not be — the system it finds will be a different package,
  # named. This requires `design_system` to be checked out beside `skillwire`,
  # which is also why this site cannot yet be built in CI.
  design_system:
    path: ../../../design_system/code/design_system

dev_dependencies:
  build_runner: ^2.10.0
  build_web_compilers: ^4.8.0
  jaspr_builder: ^0.23.4
  lints: ^6.1.0

jaspr:
  mode: static
