name: skillwire_site
description: The site at skillwire.ccisne.dev. Source, not output.
publish_to: none

environment:
  sdk: ^3.10.0

dependencies:
  jaspr: ^0.23.4

  # The design-system laboratory, pinned to a commit.
  #
  # Not `path:`. A relative path needs the two repositories checked out as
  # siblings, which a runner does not do on its own — every workflow that built
  # this site had to clone the other repository into a contrived layout first. A
  # git dependency needs none of that, and the repository is public.
  #
  # Not a version either: `publish_to: none` over there is deliberate and the
  # package will never be released under that name. A commit is what there is to
  # name, so a commit is what this names.
  #
  # The pin is the useful part. A change over there does not reach this site
  # until this line moves, and moving it is a commit here — which triggers the
  # deploy like any other. Unpinned, the published page and its source would
  # drift apart with nothing saying so.
  design_system:
    git:
      url: https://github.com/ccisnedev/design_system
      path: code/design_system
      ref: 0f4d35ed0c9d80e4f21613ec6b6ac4a0af712efc

dev_dependencies:
  build_runner: ^2.10.0
  build_web_compilers: ^4.8.0
  jaspr_builder: ^0.23.4
  lints: ^6.1.0

jaspr:
  mode: static
