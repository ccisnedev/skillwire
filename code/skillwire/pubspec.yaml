name: skillwire
description: >-
  Deploys agent skills and subagents into AI coding hosts, resolving the path
  and file format each host expects. The infrastructure layer, not the payload.
version: 0.1.0
repository: https://github.com/ccisnedev/skillwire
issue_tracker: https://github.com/ccisnedev/skillwire/issues

environment:
  sdk: ^3.8.1

# R12.8: preview_executor, never modular_cli_sdk. The package needs the
# vocabulary for stating a change before making it and nothing above it.
dependencies:
  crypto: ^3.0.6
  path: ^1.9.1
  preview_executor: ^0.1.0
  yaml: ^3.1.3

dev_dependencies:
  lints: ^6.1.0
  test: ^1.31.0
